[project]
name = "panditji-express-backend"
version = "0.1.0"
description = "Pandit Ji Express — content-driven service-commerce backend (FastAPI)."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

extend-exclude = ["alembic/versions"]  # generated migration code

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# B008: calling Depends()/Query() in argument defaults is the intended FastAPI
# pattern, not a bug. BLE001: deliberate best-effort catches. RUF001/2/3: we use
# real typographic en/em dashes (and Devanagari) in copy on purpose. UP046: keep
# explicit Generic[T] for clarity and broad pydantic compatibility.
ignore = ["B008", "BLE001", "RUF001", "RUF002", "RUF003", "UP046"]

[tool.ruff.lint.per-file-ignores]
# seed.py holds long placeholder copy strings; wrapping them hurts readability.
"seed.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
